services:

  # ============================================================
  # vLLM - Long-running LLM/VLM server
  # ============================================================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ipc: host

    ports:
      - "8000:8000"

    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

    command: >
      --model Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.75
      --max-model-len 8192
      --limit-mm-per-prompt '{"image":1,"video":0}'
      --mm-processor-kwargs '{"max_pixels":401408,"min_pixels":3136}'
      --enforce-eager

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"
        ]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 30


  # ============================================================
  # INGESTION - One-shot job
  #
  # NOT started by:
  #   docker compose up
  #
  # Run explicitly with:
  #   docker compose --profile ingest run --rm ingest
  # ============================================================
  ingest:
    profiles:
      - ingest

    build: .
    container_name: rag-ingest

    command: python ingestion.py

    # GPU for DocLayout-YOLO
    gpus: all

    shm_size: '8gb'

    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_MODEL=Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      - VLLM_API_KEY=EMPTY

      - MALLOC_ARENA_MAX=1

      # Thread limits
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1

      # NVIDIA
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./extracted_visuals:/app/extracted_visuals
      - ~/.cache/huggingface:/root/.cache/huggingface

    depends_on:
      vllm:
        condition: service_healthy


  # ============================================================
  # RAG API - Long-running API server
  # ============================================================
  rag-api:
    build: .
    container_name: rag-api
    restart: unless-stopped

    command: uvicorn api:app --host 0.0.0.0 --port 8080

    ports:
      - "8080:8080"

    environment:
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_MODEL=Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      - VLLM_API_KEY=EMPTY

      - MALLOC_ARENA_MAX=1

      # CPU thread limits for embeddings/API
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1

    volumes:
      - ./chroma_db:/app/chroma_db
      - ./extracted_visuals:/app/extracted_visuals
      - ~/.cache/huggingface:/root/.cache/huggingface

    depends_on:
      vllm:
        condition: service_healthy
  
  streamlit:
    build: .
    container_name: rag-streamlit
    restart: unless-stopped
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      - RAG_API_URL=http://rag-api:8080
    volumes:
      - ./extracted_visuals:/app/extracted_visuals
    depends_on:
      rag-api:
        condition: service_started

